<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080a09" />
    <meta name="description" content="Stahlbunker 1945 — an original round-based bunker survival game." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Stahlbunker 1945</title>
    <style>
      #boot-screen{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#050706;color:#d6d0c0;font:600 11px/1.5 ui-monospace,monospace;letter-spacing:.24em;text-transform:uppercase;transition:opacity var(--boot-fade-ms,420ms) ease;}
      #boot-screen::before{content:"";position:absolute;width:96px;height:1px;background:#8f2426;box-shadow:0 0 18px #7d171a;animation:boot-pulse 1.1s ease-in-out infinite;}
      #boot-screen span{margin-top:44px;opacity:.72;}
      #boot-screen.is-ready{opacity:0;pointer-events:none;}
      @keyframes boot-pulse{0%,100%{transform:scaleX(.28);opacity:.35}50%{transform:scaleX(1);opacity:1}}
    </style>
  </head>
  <body>
    <div id="boot-screen" role="status" aria-live="polite"><span>Opening Objekt 17</span></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
